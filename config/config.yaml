# -----------------------
# General Configuration
# -----------------------
model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract

data:
  pubtator_path:   ./data_set/corpus_pubtator.txt
  trng_pmids_path:   ./data_set/corpus_pubtator_pmids_trng.txt
  dev_pmids_path:    ./data_set/corpus_pubtator_pmids_dev.txt
  test_pmids_path:   ./data_set/corpus_pubtator_pmids_test.txt
  partition_strategy: "noniid"      # "iid" or "noniid"
  noniid_alpha:        0.01          # Dirichlet distribution parameter (used only for noniid)

training:
  algorithm: FedAvg             # Options: FedAvg, FedProx, FedAdam, FedSAD, FedSD, Centralized
  num_clients: 10
  rounds:      100
  local_epochs: 2

# -----------------------
#  Unified Training Control (Shared by All Algorithms)
# -----------------------
training_control:
  # Layer freezing control
  train_last_n_layers: 4        # Train last N layers (-1: all layers, 0: classifier only, 4: last 4 layers)
  freeze_embeddings: true      # Whether to freeze embedding layers
  
  # Data sampling control
  sample_size: 200          # Number of samples per client (null means use all data)
  sample_strategy: "random"      # Sampling strategy: "random", "balanced", "stratified"
  sample_with_replacement: false  # Whether to use replacement sampling
  
  # Client selection (partial participation)
  client_fraction: 1.0          # Fraction of clients participating per round (0.3 means 30% clients participate)
  min_clients_per_round: 1        # Minimum number of clients per round

hyperparameters:
  learning_rate:      5e-5
  lr_scheduler_type:  constant    # constant, linear, cosine
  train_batch_size:   32
  eval_batch_size:    32
  max_seq_length:     128

misc:
  seed:          42
  device:        auto          # auto / cpu / cuda
  save_results:  true
  verbose:       true            # Print detailed information

# -----------------------
# FedAvg (No additional hyperparameters needed)
# -----------------------
fedavg: {}

# -----------------------
# FedProx Specific Hyperparameters
# -----------------------
fedprox:
  mu: 0.5                      # Proximal term weight

# -----------------------
# FedAdam Specific Hyperparameters
# -----------------------
fedadam:
  server_lr: 0.0005              # Server-side learning rate
  beta1:     0.9                  # Adam first-order momentum coefficient
  beta2:     0.999                # Adam second-order momentum coefficient

# -----------------------
# FedSD (FedAvg-KD) Specific Hyperparameters
# -----------------------
fedsd:
  alpha_ce: 1        # Weight for cross-entropy loss
  alpha_kl: 1        # Weight for KL divergence distillation loss
  alpha_hidden: 0.0    # Weight for hidden layer MSE loss (set to 0.0 means not used)
  temperature: 2.0     # Temperature for knowledge distillation
  
# ----------------------
# FedSAD Specific Hyperparameters
# -----------------------
fedsad:
  # Distillation control
  use_distillation: true        # Whether to enable distillation
  kd_start_round: 2             # Which round to start distillation (1-based)
  teacher_policy: "ema_first"   # {"ema_first","cold_then_ema","prev_global"}
  first_ema_m0: 0.6            # Only effective for "ema_first"
  ema_m_min: 0.6               # Lower bound for subsequent EMA momentum
  ema_m_max: 0.6           # Upper bound for subsequent EMA momentum
  temperature_start: 5          # Initial temperature (high temp promotes exploration)
  temperature_end:   1.5          # Final temperature (low temp promotes precision)

  # Loss weight scheduling
  alpha_ce_start: 1            # Initial weight for CE loss
  alpha_ce_end:    0.7          # Final weight for CE loss
  alpha_kd_start: 0.0          # Initial weight for KD loss
  alpha_kd_end:    0.3          # Final weight for KD loss
  
  # Hidden layer distillation
  hidden_distill: false            # Whether to distill hidden layers
  alpha_hidden:    0.0          # Hidden layer distillation weight
  o_downweight: 1             # no downweight
  
  # Gradient compression (turn off)
  compress_gradients: false      # Whether to compress gradients 
  compress_topk:       0          # Number of singular values to retain in SVD compression
  compress_min_dim:    100          # Minimum dimension threshold
